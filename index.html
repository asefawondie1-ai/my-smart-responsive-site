<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Design</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #007acc;
            margin-bottom: 15px;
            font-size: 2rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #007acc;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ሰላም ዓለም! 👋</h1>
        <p>ይህ የእኔ የመጀመሪያው ሙሉ በሙሉ ሪስፖንሲቭ (Responsive) የሆነ የዌብ ገጽ ዲዛይን ነው። በስልክም በኮምፒውተርም በትክክል ይስተካከላል!</p>
        <a href="#" class="btn">የበለጠ እወቅ</a>
    </div>

</body>
</html>
